# The gate. Nothing reaches main without passing this, and Renovate will not merge its own
# pull requests until it does.
#
# Three jobs, in order of how fast they tell you something is wrong:
#   check   the linter, the types and the unit tests. No services, under a minute.
#   verify  the real thing: a database, the migrations, the seed, a production build, and
#           the 318 end-to-end tests against it.
#   render  did the page itself change? Builds the pull request and its merge base and
#           compares what the browser computes for every element. See scripts/.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing here is a secret. The database is a throwaway container, and the Turnstile pair
  # is Cloudflare's published always-passes test key, which is what makes the contact form's
  # happy path deterministic without holding a real key in a public repository.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/anna_ci
  PAYLOAD_SECRET: ci-not-a-secret-the-database-is-thrown-away
  CONTACT_DELIVERY: log
  TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  NEXT_PUBLIC_SITE_URL: https://anna-milazzo.com
  # No S3_* on purpose: without them the bucket is skipped and uploads go to local disk,
  # so a pull request never writes Anna's fixtures into the real bucket. src/lib/storage.ts.

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  verify:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anna_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Fill the database
        # The seed refuses by default, because the database it is normally pointed at is
        # the live one. Here it is a container that is deleted with the runner.
        env:
          SEED_OVERWRITE_LIVE_CONTENT: 'yes'
        run: |
          bun run migrate
          bun run seed

      - run: bun run build

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  render:
    name: Did the page change
    # Only on pull requests: there is nothing to compare a push to main against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anna_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          # Both sides of the comparison have to be reachable.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Keep a copy of the comparison tools that survives the checkout
        # Two constraints at once. They are tracked on this branch and absent from the base,
        # so `git checkout` of the base would delete them; and they import the project's
        # Playwright, so they have to run from inside the working tree or Bun resolves its
        # own global copy instead, whose browser is a different version and is not
        # installed. An untracked file at the repository root satisfies both: checkout
        # leaves it alone, and module resolution finds node_modules from there.
        run: |
          cp scripts/render-fingerprint.mjs ./.ci-render-fingerprint.mjs
          cp scripts/render-diff.mjs ./.ci-render-diff.mjs

      - run: bun install --frozen-lockfile
      - name: Fill the database
        env:
          SEED_OVERWRITE_LIVE_CONTENT: 'yes'
        run: |
          bun run migrate
          bun run seed
      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Measure this pull request
        run: |
          bun run build
          PORT=3111 bun run start &
          npx --yes wait-on -t 120000 http://localhost:3111/
          bun ./.ci-render-fingerprint.mjs "$RUNNER_TEMP/head.txt"
          kill %1

      - name: Measure the base it would merge into
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          # Reinstall: on a dependency pull request the whole point is that the two sides
          # have different packages, and a stale node_modules would compare nothing.
          bun install --frozen-lockfile
          # The base may pin a different Playwright, and the browser is version-matched.
          bunx playwright install --with-deps chromium
          bun run build
          PORT=3111 bun run start &
          npx --yes wait-on -t 120000 http://localhost:3111/
          bun ./.ci-render-fingerprint.mjs "$RUNNER_TEMP/base.txt"
          kill %1

      - name: Compare
        id: compare
        # Reported on every pull request, and only allowed to fail the run on a bot's,
        # because a person changing the design on purpose is not a regression.
        continue-on-error: ${{ github.actor != 'renovate[bot]' }}
        run: bun ./.ci-render-diff.mjs "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-fingerprints
          path: |
            ${{ runner.temp }}/base.txt
            ${{ runner.temp }}/head.txt
          retention-days: 7
